name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + train/dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"

      - name: Run test suite
        run: pytest -q

      - name: Import-check the serving app
        run: python -c "from sepsis_icu import serve; print('serve import OK')"
