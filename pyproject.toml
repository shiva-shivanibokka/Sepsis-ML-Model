[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-icu"
version = "1.1.0"
description = "Early sepsis prediction from PhysioNet 2019 ICU vital-sign / lab time-series"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# Serving only. The deployed function loads artifacts/model.ubj through XGBoost's
# own loader and applies the scaler from artifacts/serving.json as two numpy
# operations, so scikit-learn, pandas, joblib and imbalanced-learn are all
# training-time dependencies and stay out of the deployment. `export_serving.py`
# is what makes that safe: it refuses to write those artifacts unless they
# reproduce the trained pipeline's probabilities exactly.
dependencies = [
    "fastapi>=0.110",
    # Plain uvicorn, not uvicorn[standard]: the serverless runtime supplies its
    # own ASGI server, so uvloop/httptools/watchfiles are ~10 MB of nothing.
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.24",
    # xgboost-cpu is the same package built without the bundled CUDA runtime:
    # 23 MB unpacked against 84 MB, which is what brings the serverless bundle
    # under its 500 MB ceiling. It imports as `xgboost` and is published for
    # Linux and Windows only, so other platforms take the ordinary wheel.
    "xgboost-cpu>=2.0; sys_platform == 'linux'",
    "xgboost>=2.0; sys_platform != 'linux'",
]

[project.optional-dependencies]
# Everything the notebooks and train.py need, including the libraries required to
# read the training pickle and to run export_serving.py.
train = [
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "imbalanced-learn>=0.10",
    "joblib>=1.2",
    "scikit-optimize>=0.9",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
sepsis-train = "train:main"

[tool.setuptools]
packages = ["sepsis_icu"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
